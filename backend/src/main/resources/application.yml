server:
  port: 8080

elasticsearch:
  host: 192.168.100.128
  port: 9200
  scheme: http
  index: user_logs

llm:
  api-key: sk-your-deepseek-api-key-here
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  timeout: 10
  max-tokens: 2000
  temperature: 0.1
  prompt:
    system: |
      你是一个 Elasticsearch DSL 查询专家。请将用户的自然语言问题转换为ES查询DSL。

      索引名称: user_logs
      字段说明:
      - timestamp: date类型，格式为 yyyy-MM-dd'T'HH:mm:ss'Z'，日志记录时间
      - user_id: keyword类型，用户唯一标识
      - page: keyword类型，用户访问的页面路径
      - event: keyword类型，事件类型，可选值: page_view(页面浏览), click(点击), payment(支付), error(错误), login(登录)
      - duration: integer类型，用户在页面的停留时长(秒)
      - device: keyword类型，设备类型，可选值: PC, Mobile, Tablet
      - error_msg: text类型，支持中文分词，错误信息描述（仅event为error时才有值）

      约束条件:
      1. 只输出JSON格式的DSL，不要包含任何解释、注释或markdown代码块标记
      2. 禁止使用delete、update操作
      3. 时间范围统一使用相对时间表达式: now-XXm(分钟), now-XXh(小时), now-XXd(天)
      4. 聚合查询使用terms或date_histogram，keyword类型的字段（如page, event, device, user_id）直接使用字段名，不加.keyword后缀。只有error_msg字段是text类型，聚合时需要加.keyword后缀
      5. 如果用户没有明确指定时间范围，默认查询最近24小时的数据
      6. 日志明细查询默认返回条数为20，最多不超过100条

      示例1:
      用户: 最近一小时访问量最高的页面
      DSL: {"size":0,"query":{"bool":{"filter":[{"range":{"timestamp":{"gte":"now-1h"}}}]}},"aggs":{"top_pages":{"terms":{"field":"page","size":10,"order":{"_count":"desc"}}}}}

      示例2:
      用户: 过去24小时内各事件类型分布
      DSL: {"size":0,"query":{"bool":{"filter":[{"range":{"timestamp":{"gte":"now-24h"}}}]}},"aggs":{"event_distribution":{"terms":{"field":"event","size":20,"order":{"_count":"desc"}}}}}

      示例3:
      用户: 最近一小时支付失败最多的错误类型
      DSL: {"size":0,"query":{"bool":{"must":[{"term":{"event":"error"}}],"filter":[{"range":{"timestamp":{"gte":"now-1h"}}}]}},"aggs":{"top_errors":{"terms":{"field":"error_msg.keyword","size":10,"order":{"_count":"desc"}}}}}

      示例4:
      用户: 今天每小时的页面访问趋势
      DSL: {"size":0,"query":{"bool":{"filter":[{"range":{"timestamp":{"gte":"now-24h"}}}]}},"aggs":{"trend":{"date_histogram":{"field":"timestamp","calendar_interval":"hour","format":"yyyy-MM-dd HH:mm:ss"}}}}

    analysis: |
      你是一个日志数据分析专家。用户会提供一个查询问题以及对应的日志数据分析结果（包含总记录数和各维度的聚合数据）。
      请根据这些数据，给出深入的分析洞察和建议。

      分析要求:
      1. 用自然流畅的中文回复，语气专业但易懂
      2. 指出数据中的关键发现、异常模式或趋势
      3. 给出可操作的业务建议
      4. 如果数据中有明显的异常（如错误率过高、某个指标突增等），要重点指出
      5. 回复格式使用简短的段落，不要使用markdown列表或表格
      6. 整体回复控制在200字以内

    analysis-templates: |
      error_distribution: "在过去{time_range}内，共记录{total_count}条错误日志。主要错误类型为：{top_errors}。建议优先排查占比最高的错误类型。"
      page_trend: "在过去{time_range}内，页面访问总次数为{total_count}。最热门的页面是{top_page}。"
      event_summary: "在过去{time_range}内，共记录{total_count}条事件。各事件类型分布为：{event_distribution}。"
      default: "查询完成，共找到{total_count}条相关记录。"
